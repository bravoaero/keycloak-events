name: CI Build
on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload provider JAR
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-events
          path: target/keycloak-events-*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload JaCoCo Coverage Report as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: ${{ github.workspace }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 30
      - name: Check if JaCoCo CSV exists
        id: check-jacoco
        run: |
          if [ -f "target/site/jacoco/jacoco.csv" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Add JaCoCo Coverage to Action Summary
        if: steps.check-jacoco.outputs.exists == 'true'
        uses: jjmrocha/jacoco-summary@v1.1.1
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
