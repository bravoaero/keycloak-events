name: CI Build
on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        id: maven-build
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Report failed tests
        if: steps.maven-build.outcome == 'failure'
        shell: bash
        run: |
          python3 <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          def escape(value):
              return (value or "No failure details were recorded.").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          found = False
          for report in glob.glob("target/surefire-reports/TEST-*.xml"):
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  found = True
                  title = f"{case.get('classname', 'test')}.{case.get('name', 'unknown')}"
                  details = failure.get("message") or failure.text
                  print(f"::error title={escape(title)}::{escape(details)[:7000]}")
          if not found:
              print("::error title=Maven build failure::No failed Surefire test case was found; inspect the Maven step.")
          PY
      - name: Upload provider JAR
        if: steps.maven-build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-events
          path: target/keycloak-events-*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload JaCoCo Coverage Report as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: ${{ github.workspace }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 30
      - name: Check if JaCoCo CSV exists
        id: check-jacoco
        run: |
          if [ -f "target/site/jacoco/jacoco.csv" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Add JaCoCo Coverage to Action Summary
        if: steps.check-jacoco.outputs.exists == 'true'
        uses: jjmrocha/jacoco-summary@v1.1.1
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
      - name: Fail when Maven build failed
        if: steps.maven-build.outcome == 'failure'
        run: |
          echo "::error::Maven build or tests failed. See the Maven step and surefire-reports artifact."
          exit 1
