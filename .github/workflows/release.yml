name: Build and publish release

on:
  push:
    tags:
      - 'v*-bravo.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify tag matches Maven version
        shell: bash
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Maven version ${version}." >&2
            exit 1
          fi

      - name: Build release JAR
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          cp "target/keycloak-events-${GITHUB_REF_NAME#v}.jar" dist/
          cp LICENSE NOTICE dist/
          cd dist
          sha256sum "keycloak-events-${GITHUB_REF_NAME#v}.jar" > "keycloak-events-${GITHUB_REF_NAME#v}.jar.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "Keycloak Events ${GITHUB_REF_NAME#v}" \
            --generate-notes
